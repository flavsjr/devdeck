version: 2
updates:
  # Mantém as actions fixadas por SHA atualizadas (o Dependabot reescreve o SHA e o comentário de versão).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Dependências npm: correções de segurança e atualizações agrupadas, poucas PRs abertas por vez.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types: [minor, patch]
