name: CI

on:
  push:
    branches: [main, 'sprint/**']
  pull_request:
  workflow_dispatch:

# Token do workflow só lê o repositório. Nada de pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Typecheck, testes e electron-vite build não precisam do binário do Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Nenhum it.todo pendente da Sprint 04
        shell: bash
        run: |
          if grep -rn "it.todo('Sprint 04" tests; then echo "::error::it.todo da Sprint 04 ainda pendente"; exit 1; fi

  package:
    # Empacota (sem instalador) para pegar quebra de electron-builder, fuses ou hash do SDK antes da tag.
    # Fora de PR: baixa ~700 MB e leva minutos.
    name: package (windows)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # pack:win = build + electron-builder --dir (afterPack confere o SDK) + verify-fuses
      - run: npm run pack:win
      # E2E com Playwright no Electron: fluxo "Git pausado" → confiar (diálogo nativo respondido pelo teste).
      - run: npm run test:e2e

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
